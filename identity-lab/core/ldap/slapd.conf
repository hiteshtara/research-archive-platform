include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
pidfile  /run/openldap/slapd.pid
modulepath /usr/lib/openldap
moduleload back_mdb.so
database mdb
maxsize  10485760
suffix   "dc=lab,dc=invalid"
rootdn   "cn=admin,dc=lab,dc=invalid"
rootpw   LAB_ROOT_PASSWORD
directory /var/lib/openldap/lab
index uid eq
# The IdP binds as the read-only service account to search; users bind as themselves.
access to attrs=userPassword
  by dn.exact="cn=idp-reader,dc=lab,dc=invalid" auth
  by anonymous auth
  by self read
  by * none
access to *
  by dn.exact="cn=idp-reader,dc=lab,dc=invalid" read
  by * none
