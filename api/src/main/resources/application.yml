spring:
  application:
    name: research-archive-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:research_archive}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: archive
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

server:
  port: 8080

logging:
  level:
    edu.bu.archive.adapter.out.ai.OpenAiProvider: DEBUG
    edu.bu.archive.application.ai.AwardAiSummaryService: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  explorer:
    # Read-only Archive Explorer (Phase 2, /api/v1/explorer/**) - see
    # docs/ARCHIVE_EXPLORER.md. Disabled by default everywhere; enabled
    # explicitly per-environment (dev only, for now) via Terraform.
    enabled: ${APP_EXPLORER_ENABLED:false}

  ai:
    enabled: ${APP_AI_ENABLED:${AI_ENABLED:false}}
    stub-enabled: ${APP_AI_STUB_ENABLED:${AI_STUB_ENABLED:false}}
    openai-enabled: ${APP_AI_OPENAI_ENABLED:false}
    questions-enabled: ${APP_AI_QUESTIONS_ENABLED:false}
    provider: ${APP_AI_PROVIDER:${AI_PROVIDER:}}
    open-ai-model: ${APP_AI_OPENAI_MODEL:gpt-5-mini}
    open-ai-base-url: ${APP_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
    open-ai-timeout-seconds: ${APP_AI_OPENAI_TIMEOUT_SECONDS:60}
    open-ai-connect-timeout-seconds: ${APP_AI_OPENAI_CONNECT_TIMEOUT_SECONDS:10}
    prompt-version: ${APP_AI_PROMPT_VERSION:award-summary-v2}
    question-prompt-version: ${APP_AI_QUESTION_PROMPT_VERSION:award-question-v1}
    cache-enabled: ${APP_AI_CACHE_ENABLED:false}
    cache-max-entries: ${APP_AI_CACHE_MAX_ENTRIES:250}
    max-records: ${AI_MAX_RECORDS:100}
    max-serialized-context-chars: ${AI_MAX_CONTEXT_CHARS:20000}

  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI}
      client-id: ${COGNITO_CLIENT_ID}

  cors:
    # No non-localhost default - the real deployed UI origin(s) must be
    # supplied via APP_CORS_ALLOWED_ORIGINS (wired from Terraform's
    # Amplify branch_url; see terraform/environments/*/main.tf). An
    # earlier version of this default hardcoded a personal AWS
    # account's Amplify domain - see
    # docs/architecture/AWARD_IMPLEMENTATION_ROADMAP.md's "Thirteenth
    # same-day follow-up".
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

  attachments:
    # "s3" (default) reads from the private documents bucket via
    # S3SubawardAttachmentStorage. "local" reads synthetic fixtures from
    # disk via LocalSubawardAttachmentStorage - see application-local.yml
    # and scripts/seed-local-subaward-attachments.sql.
    storage: ${APP_ATTACHMENTS_STORAGE:s3}
    local-directory: ${APP_ATTACHMENTS_LOCAL_DIRECTORY:local-data/attachments}
    local-bucket: ${APP_ATTACHMENTS_LOCAL_BUCKET:local-fixtures}
