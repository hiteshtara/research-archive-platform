spring:
  application:
    name: research-archive-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:research_archive}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: archive
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  ai:
    enabled: ${APP_AI_ENABLED:${AI_ENABLED:false}}
    stub-enabled: ${APP_AI_STUB_ENABLED:${AI_STUB_ENABLED:false}}
    openai-enabled: ${APP_AI_OPENAI_ENABLED:false}
    provider: ${APP_AI_PROVIDER:${AI_PROVIDER:}}
    open-ai-model: ${APP_AI_OPENAI_MODEL:gpt-5}
    open-ai-base-url: ${APP_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
    open-ai-timeout-seconds: ${APP_AI_OPENAI_TIMEOUT_SECONDS:60}
    open-ai-connect-timeout-seconds: ${APP_AI_OPENAI_CONNECT_TIMEOUT_SECONDS:10}
    max-records: ${AI_MAX_RECORDS:100}
    max-serialized-context-chars: ${AI_MAX_CONTEXT_CHARS:20000}

  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI}
      client-id: ${COGNITO_CLIENT_ID}
