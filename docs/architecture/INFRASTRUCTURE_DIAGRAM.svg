<svg viewBox="0 0 1320 800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Research Archive Platform AWS infrastructure, as provisioned by Terraform</title>
<desc>Browser reaches an optional Amplify-hosted React UI, which calls an Application Load Balancer inside a VPC. The ALB routes to an ECS API service, which reads a private RDS PostgreSQL instance and validates JWTs against Cognito. A separate ECS ETL loader task also reads RDS, writes to S3, reads Secrets Manager, and reaches a BU-managed Oracle staging VPC over VPC peering. Both ECS services pull images from ECR.</desc>
<defs>
<style>
  svg { --bg:#ffffff; --panel:#f7f8fa; --panel2:#eef1f5; --border:#d7dce2; --borderStrong:#b7c0ca; --text:#1f2937; --textMut:#6b7280; --accent:#2563eb; --accentSoft:#e0e9fd; --accent2:#7c3aed; --accent2Soft:#efe9fd; --ext:#b45309; --extSoft:#fdf1de; }
  .title { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--text); font-size:20px; font-weight:700; }
  .subtitle { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:12.5px; }
  .grouplabel { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:11px; font-weight:700; letter-spacing:.05em; }
  .label { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--text); font-size:13.5px; font-weight:600; }
  .sub { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:10.5px; }
  .edge { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:10px; }
  .box { fill:var(--panel); stroke:var(--borderStrong); stroke-width:1.4; }
  .boxAccent { fill:var(--accentSoft); stroke:var(--accent); stroke-width:1.4; }
  .boxAccent2 { fill:var(--accent2Soft); stroke:var(--accent2); stroke-width:1.4; }
  .boxExt { fill:var(--extSoft); stroke:var(--ext); stroke-width:1.4; stroke-dasharray:5 3; }
  .vpc { fill:var(--bg); stroke:var(--border); stroke-width:1.6; stroke-dasharray:2 0; }
  .flow { stroke:var(--accent); stroke-width:1.6; fill:none; }
  .flowMut { stroke:var(--borderStrong); stroke-width:1.4; fill:none; }
  .flowDash { stroke:var(--textMut); stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="var(--borderStrong)"/>
</marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
</marker>
<marker id="arrowMut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="var(--textMut)"/>
</marker>
</defs>

<rect x="0" y="0" width="1320" height="800" fill="var(--bg)"/>

<text x="660" y="30" text-anchor="middle" class="title">Research Archive Platform — AWS Infrastructure</text>
<text x="660" y="49" text-anchor="middle" class="subtitle">Provisioned by terraform/modules/*, wired per environment in environments/{dev,test,prod}/main.tf</text>

<!-- Browser -->
<rect x="580" y="66" width="160" height="46" rx="9" class="box"/>
<text x="660" y="86" text-anchor="middle" class="label">Browser</text>
<text x="660" y="101" text-anchor="middle" class="sub">End user</text>

<!-- Amplify -->
<rect x="440" y="140" width="190" height="56" rx="9" class="boxAccent2"/>
<text x="535" y="163" text-anchor="middle" class="label">Amplify</text>
<text x="535" y="179" text-anchor="middle" class="sub">React UI · optional (manage_amplify)</text>

<!-- Cognito -->
<rect x="690" y="140" width="190" height="56" rx="9" class="boxAccent2"/>
<text x="785" y="163" text-anchor="middle" class="label">Cognito</text>
<text x="785" y="179" text-anchor="middle" class="sub">User pool · optional (manage_cognito)</text>

<!-- Browser -> Amplify -->
<path d="M630,112 L555,140" class="flowMut" marker-end="url(#arrowMut)"/>
<!-- Amplify -> Cognito (oauth) -->
<path d="M630,168 L690,168" class="flowDash" marker-end="url(#arrowMut)"/>
<text x="660" y="163" text-anchor="middle" class="edge">OAuth</text>

<!-- VPC boundary -->
<rect x="140" y="230" width="780" height="360" rx="14" class="vpc"/>
<text x="164" y="253" class="grouplabel">VPC · 10.30.0.0/16 (CIDR differs per environment)</text>

<text x="170" y="275" class="grouplabel" fill-opacity="0.8">PUBLIC SUBNETS</text>
<rect x="180" y="284" width="150" height="54" rx="8" class="boxAccent"/>
<text x="255" y="306" text-anchor="middle" class="label">ALB</text>
<text x="255" y="321" text-anchor="middle" class="sub">:80 / :443 listener</text>

<rect x="350" y="284" width="150" height="54" rx="8" class="box"/>
<text x="425" y="306" text-anchor="middle" class="label">NAT Gateway</text>
<text x="425" y="321" text-anchor="middle" class="sub">optional egress</text>

<rect x="520" y="284" width="220" height="54" rx="8" class="box"/>
<text x="630" y="306" text-anchor="middle" class="label">VPC Endpoints</text>
<text x="630" y="321" text-anchor="middle" class="sub">ECR · Logs · Secrets · STS · S3</text>

<text x="170" y="368" class="grouplabel" fill-opacity="0.8">PRIVATE SUBNETS</text>
<rect x="180" y="378" width="190" height="66" rx="8" class="boxAccent"/>
<text x="275" y="402" text-anchor="middle" class="label">ECS: API Service</text>
<text x="275" y="418" text-anchor="middle" class="sub">Spring Boot · Fargate</text>

<rect x="400" y="378" width="190" height="66" rx="8" class="boxAccent2"/>
<text x="495" y="402" text-anchor="middle" class="label">ECS: ETL Loader</text>
<text x="495" y="418" text-anchor="middle" class="sub">Python · Fargate, on-demand</text>

<rect x="620" y="378" width="190" height="66" rx="8" class="box"/>
<text x="715" y="402" text-anchor="middle" class="label">RDS PostgreSQL</text>
<text x="715" y="418" text-anchor="middle" class="sub">archive schema</text>

<!-- Amplify -> ALB -->
<path d="M500,196 C420,230 300,250 255,284" class="flow" marker-end="url(#arrowAccent)"/>
<text x="360" y="248" text-anchor="middle" class="edge">API calls</text>

<!-- ALB -> API ECS -->
<path d="M255,338 L275,378" class="flow" marker-end="url(#arrowAccent)"/>

<!-- API ECS -> Cognito -->
<path d="M330,378 C450,300 560,230 690,178" class="flowDash" marker-end="url(#arrowMut)"/>
<text x="480" y="270" text-anchor="middle" class="edge">validate JWT</text>

<!-- API ECS -> RDS -->
<path d="M370,411 L620,411" class="flow" marker-end="url(#arrowAccent)"/>
<text x="495" y="405" text-anchor="middle" class="edge">JDBC</text>

<!-- Loader ECS -> RDS -->
<path d="M590,428 L620,428" class="flowMut" marker-end="url(#arrowMut)"/>

<!-- Storage & secrets row -->
<rect x="180" y="620" width="190" height="58" rx="8" class="box"/>
<text x="275" y="644" text-anchor="middle" class="label">S3</text>
<text x="275" y="660" text-anchor="middle" class="sub">data + documents buckets</text>

<rect x="400" y="620" width="190" height="58" rx="8" class="box"/>
<text x="495" y="644" text-anchor="middle" class="label">Secrets Manager</text>
<text x="495" y="660" text-anchor="middle" class="sub">Postgres · Oracle · OpenAI</text>

<rect x="620" y="620" width="190" height="58" rx="8" class="box"/>
<text x="715" y="644" text-anchor="middle" class="label">ECR</text>
<text x="715" y="660" text-anchor="middle" class="sub">api + loader repos</text>

<!-- Loader -> S3 -->
<path d="M460,444 C390,510 320,560 275,620" class="flowMut" marker-end="url(#arrowMut)"/>
<!-- Loader -> Secrets -->
<path d="M495,444 L495,620" class="flowMut" marker-end="url(#arrowMut)"/>
<!-- API -> Secrets -->
<path d="M290,444 C330,510 400,570 460,625" class="flowMut" marker-end="url(#arrowMut)"/>
<!-- ECR -> API ECS -->
<path d="M660,620 C500,540 350,480 280,444" class="flowDash" marker-end="url(#arrowMut)"/>
<!-- ECR -> Loader ECS -->
<path d="M700,620 L500,444" class="flowDash" marker-end="url(#arrowMut)"/>
<text x="600" y="540" text-anchor="middle" class="edge">image pull</text>

<!-- External Oracle VPC -->
<rect x="970" y="378" width="290" height="110" rx="10" class="boxExt"/>
<text x="1115" y="410" text-anchor="middle" class="label">BU Oracle Staging VPC</text>
<text x="1115" y="428" text-anchor="middle" class="sub">external · BU-managed</text>
<text x="1115" y="443" text-anchor="middle" class="sub">Oracle RDS (KCOEUS)</text>
<text x="1115" y="461" text-anchor="middle" class="sub">not created/destroyed by this project</text>

<!-- Loader -> Oracle -->
<path d="M590,405 C750,395 850,395 970,410" class="flowDash" marker-end="url(#arrowMut)"/>
<text x="800" y="388" text-anchor="middle" class="edge">VPC peering (enable_oracle_peering)</text>

<!-- Legend -->
<rect x="180" y="722" width="18" height="14" rx="3" class="boxAccent"/>
<text x="205" y="733" class="sub">core request path</text>
<rect x="360" y="722" width="18" height="14" rx="3" class="boxAccent2"/>
<text x="385" y="733" class="sub">ETL / auth (optional toggles)</text>
<line x1="600" y1="729" x2="628" y2="729" class="flowDash"/>
<text x="636" y="733" class="sub">supporting / cross-cutting</text>
<rect x="850" y="722" width="18" height="14" rx="3" class="boxExt"/>
<text x="875" y="733" class="sub">external, not Terraform-owned</text>

<text x="660" y="770" text-anchor="middle" class="subtitle">Modules: vpc · rds · s3 · secrets · api_ecr/ecr · api_service · ecs (loader) · cognito · amplify</text>
</svg>
