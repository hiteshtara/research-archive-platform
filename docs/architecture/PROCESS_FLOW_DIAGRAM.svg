<svg viewBox="0 0 1320 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Research Archive Platform end-to-end process flow</title>
<desc>Data flows one way, read-only: Kuali Oracle to a Python ETL pipeline to PostgreSQL's archive schema to a Spring Boot API to a React UI to the browser. A parallel attachments path streams document BLOBs from Oracle into an S3 documents bucket, served by the API as signed downloads. An optional, flag-gated AI layer sits on the API, building a redacted context and validating model citations before any answer reaches the UI. No arrow ever points back toward Oracle.</desc>
<defs>
<style>
  svg { --bg:#ffffff; --panel:#f7f8fa; --border:#d7dce2; --borderStrong:#b7c0ca; --text:#1f2937; --textMut:#6b7280; --accent:#2563eb; --accentSoft:#e0e9fd; --accent2:#0f766e; --accent2Soft:#dcf3f0; --accent3:#7c3aed; --accent3Soft:#efe9fd; }
  .title { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--text); font-size:19px; font-weight:700; }
  .subtitle { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:12px; }
  .grouplabel { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:10.5px; font-weight:700; letter-spacing:.05em; }
  .label { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--text); font-size:13px; font-weight:600; }
  .sub { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:10px; }
  .edge { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:9.5px; }
  .box { fill:var(--panel); stroke:var(--borderStrong); stroke-width:1.4; }
  .boxAccent { fill:var(--accentSoft); stroke:var(--accent); stroke-width:1.4; }
  .boxAccent2 { fill:var(--accent2Soft); stroke:var(--accent2); stroke-width:1.4; }
  .boxAccent3 { fill:var(--accent3Soft); stroke:var(--accent3); stroke-width:1.4; }
  .flow { stroke:var(--accent); stroke-width:1.8; fill:none; }
  .flowMut { stroke:var(--borderStrong); stroke-width:1.3; fill:none; }
  .flowDash { stroke:var(--textMut); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
</style>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
<marker id="arrowMut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--textMut)"/></marker>
</defs>

<rect x="0" y="0" width="1320" height="620" fill="var(--bg)"/>
<text x="660" y="27" text-anchor="middle" class="title">Research Archive Platform — End-to-End Process Flow</text>
<text x="660" y="45" text-anchor="middle" class="subtitle">Kuali Oracle to the browser, read-only and one-way — see INFRASTRUCTURE, ETL_PIPELINE and DATABASE_LOADERS diagrams for detail on each stage</text>

<!-- Main spine -->
<rect x="60" y="90" width="175" height="90" rx="9" class="boxAccent"/>
<text x="147" y="118" text-anchor="middle" class="label">Oracle (Kuali)</text>
<text x="147" y="134" text-anchor="middle" class="sub">BU VPN · source of</text>
<text x="147" y="147" text-anchor="middle" class="sub">truth until retirement</text>

<rect x="260" y="90" width="175" height="90" rx="9" class="boxAccent"/>
<text x="347" y="118" text-anchor="middle" class="label">ETL (Python)</text>
<text x="347" y="134" text-anchor="middle" class="sub">extract → validate →</text>
<text x="347" y="147" text-anchor="middle" class="sub">transform → load</text>

<rect x="460" y="90" width="175" height="90" rx="9" class="boxAccent"/>
<text x="547" y="118" text-anchor="middle" class="label">PostgreSQL</text>
<text x="547" y="134" text-anchor="middle" class="sub">archive schema</text>
<text x="547" y="147" text-anchor="middle" class="sub">7 domains, RDS</text>

<rect x="660" y="90" width="175" height="90" rx="9" class="boxAccent"/>
<text x="747" y="118" text-anchor="middle" class="label">Spring Boot API</text>
<text x="747" y="134" text-anchor="middle" class="sub">JdbcClient · REST</text>
<text x="747" y="147" text-anchor="middle" class="sub">Cognito-authenticated</text>

<rect x="860" y="90" width="175" height="90" rx="9" class="boxAccent"/>
<text x="947" y="118" text-anchor="middle" class="label">React UI</text>
<text x="947" y="134" text-anchor="middle" class="sub">Amplify-hosted</text>
<text x="947" y="147" text-anchor="middle" class="sub">(bring-your-own OK)</text>

<rect x="1060" y="90" width="175" height="90" rx="9" class="box"/>
<text x="1147" y="118" text-anchor="middle" class="label">Browser</text>
<text x="1147" y="134" text-anchor="middle" class="sub">End user</text>
<text x="1147" y="147" text-anchor="middle" class="sub">BU researcher / staff</text>

<path d="M235,135 L260,135" class="flow" marker-end="url(#arrowAccent)"/>
<text x="247" y="126" text-anchor="middle" class="edge">reads</text>
<path d="M435,135 L460,135" class="flow" marker-end="url(#arrowAccent)"/>
<text x="447" y="126" text-anchor="middle" class="edge">loads</text>
<path d="M635,135 L660,135" class="flow" marker-end="url(#arrowAccent)"/>
<text x="647" y="126" text-anchor="middle" class="edge">SQL</text>
<path d="M835,135 L860,135" class="flow" marker-end="url(#arrowAccent)"/>
<text x="847" y="126" text-anchor="middle" class="edge">JSON</text>
<path d="M1035,135 L1060,135" class="flow" marker-end="url(#arrowAccent)"/>
<text x="1047" y="126" text-anchor="middle" class="edge">renders</text>

<!-- Attachments side path -->
<text x="62" y="225" class="grouplabel">ATTACHMENTS / DOCUMENTS</text>
<rect x="60" y="238" width="280" height="60" rx="8" class="boxAccent2"/>
<text x="200" y="262" text-anchor="middle" class="label">Oracle BLOB reader</text>
<text x="200" y="277" text-anchor="middle" class="sub">archive_attachments.py · ECS loader</text>

<rect x="460" y="238" width="280" height="60" rx="8" class="boxAccent2"/>
<text x="600" y="262" text-anchor="middle" class="label">S3: documents bucket</text>
<text x="600" y="277" text-anchor="middle" class="sub">binary storage, per-domain prefixes</text>

<path d="M340,268 L460,268" class="flow" marker-end="url(#arrowAccent)"/>
<path d="M600,238 C650,200 700,160 730,180" class="flowDash" marker-end="url(#arrowMut)"/>
<text x="705" y="200" text-anchor="middle" class="edge">signed download URL</text>

<!-- AI side path -->
<text x="462" y="345" class="grouplabel">AI FEATURES — OPTIONAL, FLAG-GATED (app.ai.*)</text>
<rect x="460" y="358" width="280" height="64" rx="8" class="boxAccent3"/>
<text x="600" y="382" text-anchor="middle" class="label">AwardContextBuilder</text>
<text x="600" y="397" text-anchor="middle" class="sub">redacts + truncates before any model call</text>

<rect x="860" y="358" width="280" height="64" rx="8" class="boxAccent3"/>
<text x="1000" y="382" text-anchor="middle" class="label">AI Provider</text>
<text x="1000" y="397" text-anchor="middle" class="sub">Stub (default) or OpenAI · citation-checked</text>

<path d="M747,180 C700,260 650,330 600,358" class="flowDash" marker-end="url(#arrowMut)"/>
<text x="695" y="290" text-anchor="middle" class="edge">build context</text>
<path d="M740,390 L860,390" class="flowDash" marker-end="url(#arrowMut)"/>
<path d="M1000,358 C980,300 850,220 780,182" class="flowDash" marker-end="url(#arrowMut)"/>
<text x="960" y="270" text-anchor="middle" class="edge">validated answer only</text>

<!-- Read-only note -->
<rect x="60" y="450" width="1175" height="50" rx="8" class="box" stroke-dasharray="4 3"/>
<text x="647" y="472" text-anchor="middle" class="sub">Read-only, one-way, end to end: only the ETL ever touches Oracle, and only to read. Nothing in this diagram — ETL, API, or AI provider —</text>
<text x="647" y="487" text-anchor="middle" class="sub">ever writes back to Oracle. No arrow above points right-to-left.</text>

<!-- Legend -->
<rect x="230" y="525" width="18" height="13" rx="3" class="boxAccent"/>
<text x="254" y="536" class="sub">core read path</text>
<rect x="420" y="525" width="18" height="13" rx="3" class="boxAccent2"/>
<text x="444" y="536" class="sub">attachments / documents</text>
<rect x="640" y="525" width="18" height="13" rx="3" class="boxAccent3"/>
<text x="664" y="536" class="sub">AI layer (optional)</text>
<line x1="860" y1="532" x2="888" y2="532" class="flowDash"/>
<text x="896" y="536" class="sub">supporting / async flow</text>

<text x="660" y="570" text-anchor="middle" class="subtitle">Terraform provisions every box above except the browser — see docs/architecture/INFRASTRUCTURE_DIAGRAM.svg</text>
</svg>
