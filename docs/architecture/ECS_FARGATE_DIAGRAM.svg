<path d="M220,96 L275,96" class="flowAccent" marker-end="url(#arrowAccent)"/>
<text x="247" y="88" text-anchor="middle" class="edge">reads</text>
<path d="M465,96 L520,96" class="flowAccent" marker-end="url(#arrowAccent)"/>
<text x="492" y="88" text-anchor="middle" class="edge">loads</text>
<path d="M710,96 L765,96" class="flowAccent" marker-end="url(#arrowAccent)"/>
<text x="737" y="88" text-anchor="middle" class="edge">SQL</text>
<path d="M925,96 L980,96" class="flowAccent" marker-end="url(#arrowAccent)"/>
<text x="952" y="88" text-anchor="middle" class="edge">context</text>

<text x="650" y="136" text-anchor="middle" class="sub">one-way, read-only — see PROCESS_FLOW_DIAGRAM.svg for the full platform picture</text>

<!-- AWS Fargate band -->
<rect x="390" y="150" width="520" height="46" rx="8" class="boxNeutral"/>
<text x="650" y="169" text-anchor="middle" class="label">AWS Fargate</text>
<text x="650" y="183" text-anchor="middle" class="sub">serverless compute · no EC2 hosts to manage · every task gets its own ENI (awsvpc)</text>

<!-- Column headers -->
<text x="340" y="222" text-anchor="middle" class="colhead">API — long-running service</text>
<text x="960" y="222" text-anchor="middle" class="colhead">ARCHIVE LOADER — one-off task, no service</text>
<text x="960" y="236" text-anchor="middle" class="colsub">Award · Attachments · Protocol · Proposal · Negotiation · Subaward</text>

<!-- Cluster -->
<rect x="60" y="246" width="560" height="42" rx="7" class="box"/>
<text x="340" y="271" text-anchor="middle" class="sub" font-weight="700">ECS cluster: research-archive-platform-{env}-api</text>
<rect x="680" y="246" width="560" height="42" rx="7" class="box"/>
<text x="960" y="271" text-anchor="middle" class="sub" font-weight="700">ECS cluster: research-archive-platform-{env}-etl</text>

<!-- Service / launch -->
<rect x="60" y="302" width="560" height="60" rx="8" class="boxAccent"/>
<text x="340" y="324" text-anchor="middle" class="label">aws_ecs_service</text>
<text x="340" y="339" text-anchor="middle" class="sub">desired_count tasks, FARGATE, platform LATEST</text>
<text x="340" y="352" text-anchor="middle" class="sub">keeps N running · replaces failed tasks automatically</text>

<rect x="680" y="302" width="560" height="86" rx="8" class="boxAccent2"/>
<text x="960" y="322" text-anchor="middle" class="label">No aws_ecs_service</text>
<text x="960" y="336" text-anchor="middle" class="sub">launched via run-task:</text>
<text x="960" y="349" text-anchor="middle" class="sub" font-weight="700">run-award-loader.sh · run-award-attachment-loader.sh</text>
<text x="960" y="362" text-anchor="middle" class="sub">+ future domain loaders (Protocol, Proposal, Negotiation, Subaward)</text>
<text x="960" y="378" text-anchor="middle" class="sub">no ALB, no target group</text>

<!-- Task lifetime -->
<rect x="60" y="398" width="560" height="24" rx="12" class="box"/>
<text x="340" y="414" text-anchor="middle" class="sub" font-weight="700">ALWAYS RUNNING — replaced on deploy</text>

<rect x="680" y="398" width="150" height="24" rx="12" class="chip2"/>
<text x="755" y="414" text-anchor="middle" class="sub" font-weight="700">RUN ONCE</text>
<path d="M830,410 L850,410" class="flow" marker-end="url(#arrow)"/>
<rect x="850" y="398" width="190" height="24" rx="12" class="chip2"/>
<text x="945" y="414" text-anchor="middle" class="sub" font-weight="700">LOAD N RECORDS</text>
<path d="M1040,410 L1060,410" class="flow" marker-end="url(#arrow)"/>
<rect x="1060" y="398" width="180" height="24" rx="12" class="chip2"/>
<text x="1150" y="414" text-anchor="middle" class="sub" font-weight="700">EXIT</text>

<!-- Task definition -->
<rect x="60" y="436" width="560" height="60" rx="8" class="box"/>
<text x="340" y="458" text-anchor="middle" class="label">Task definition: family "api"</text>
<text x="340" y="473" text-anchor="middle" class="sub">FARGATE · awsvpc · cpu 512 / mem 1024 · container "api" on containerPort</text>

<rect x="680" y="436" width="560" height="60" rx="8" class="box"/>
<text x="960" y="458" text-anchor="middle" class="label">Task definition: family "loader"</text>
<text x="960" y="473" text-anchor="middle" class="sub">FARGATE · awsvpc · cpu 512 / mem 1024 · container "loader"</text>

<!-- Roles -->
<rect x="60" y="510" width="265" height="84" rx="8" class="boxAccent"/>
<text x="192" y="532" text-anchor="middle" class="label">Execution role</text>
<text x="192" y="547" text-anchor="middle" class="sub">pull image · write logs +</text>
<text x="192" y="560" text-anchor="middle" class="sub">secretsmanager:GetSecretValue</text>
<text x="192" y="573" text-anchor="middle" class="sub">on the DB (+OpenAI) secret</text>
<text x="192" y="586" text-anchor="middle" class="sub">→ injects POSTGRES_*/etc as env vars</text>

<rect x="355" y="510" width="265" height="84" rx="8" class="boxNeutral"/>
<text x="487" y="532" text-anchor="middle" class="label">Task role</text>
<text x="487" y="547" text-anchor="middle" class="sub">no Secrets Manager access</text>
<text x="487" y="560" text-anchor="middle" class="sub">s3:ListBucket / GetObject</text>
<text x="487" y="573" text-anchor="middle" class="sub">on the documents bucket only</text>
<text x="487" y="586" text-anchor="middle" class="sub">(serves attachment downloads)</text>

<rect x="680" y="510" width="265" height="84" rx="8" class="boxNeutral"/>
<text x="812" y="532" text-anchor="middle" class="label">Execution role</text>
<text x="812" y="547" text-anchor="middle" class="sub">AmazonECSTaskExecutionRolePolicy</text>
<text x="812" y="560" text-anchor="middle" class="sub">only — pull image, write logs</text>
<text x="812" y="573" text-anchor="middle" class="sub">deliberately NO Secrets Manager</text>
<text x="812" y="586" text-anchor="middle" class="sub">access at all</text>

<rect x="975" y="510" width="265" height="84" rx="8" class="boxAccent2"/>
<text x="1107" y="532" text-anchor="middle" class="label">Task role</text>
<text x="1107" y="547" text-anchor="middle" class="sub">secretsmanager:GetSecretValue on</text>
<text x="1107" y="560" text-anchor="middle" class="sub">Postgres + Oracle secrets — the app</text>
<text x="1107" y="573" text-anchor="middle" class="sub">fetches these itself, at runtime,</text>
<text x="1107" y="586" text-anchor="middle" class="sub">after its own startup validation</text>

<!-- Network -->
<rect x="60" y="604" width="560" height="54" rx="8" class="box"/>
<text x="340" y="625" text-anchor="middle" class="sub" font-weight="700">Network: awsvpc · public or private subnets (assign_public_ip = !private)</text>
<text x="340" y="639" text-anchor="middle" class="sub">SG allows inbound only from the ALB's security group, on containerPort</text>

<rect x="680" y="604" width="560" height="54" rx="8" class="box"/>
<text x="960" y="625" text-anchor="middle" class="sub" font-weight="700">Network: awsvpc · private subnets only</text>
<text x="960" y="639" text-anchor="middle" class="sub">SG referenced directly in DB/Oracle security-group ingress rules</text>

<!-- CloudWatch (merged) -->
<rect x="60" y="668" width="1180" height="54" rx="8" class="box"/>
<text x="650" y="688" text-anchor="middle" class="sub" font-weight="700">CloudWatch Logs — same AWS account, both paths</text>
<line x1="650" y1="696" x2="650" y2="714" stroke="var(--border)" stroke-width="1"/>
<text x="340" y="708" text-anchor="middle" class="sub">API: /ecs/{project}-{env}-api · stream prefix "api"</text>
<text x="960" y="708" text-anchor="middle" class="sub">Loader: /ecs/{project}-{env}-loader · stream prefix "loader"</text>

