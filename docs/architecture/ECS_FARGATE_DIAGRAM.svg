<svg viewBox="0 0 1300 960" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How ECS and Fargate are used in this project</title>
<desc>Two independent AWS Fargate workloads share the same account and VPC but are wired differently. A data-flow strip at the top shows where this fits: Oracle feeds the Loader Task, which writes into PostgreSQL (RDS), which the Spring Boot API reads, which the optional AI layer reads through the API only. The API runs as a long-running ECS service using ECS-native secret injection. The Archive Loader — now covering Award, Award Attachments, and future domains like Protocol, Proposal, Negotiation, and Subaward — runs as a one-off task launched via run-award-loader.sh or run-award-attachment-loader.sh, resolves its own secrets after a hardened startup sequence, and exits when done. Both paths log to CloudWatch in the same account. Fargate suits both workloads because they are stateless, keep no local storage, are restartable, and are idempotent.</desc>
<defs>
