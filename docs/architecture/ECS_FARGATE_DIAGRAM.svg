<!-- Why Fargate fits -->
<rect x="60" y="732" width="1180" height="48" rx="8" class="box" stroke-dasharray="4 3"/>
<text x="650" y="752" text-anchor="middle" class="sub" font-weight="700">WHY FARGATE FITS THIS WORKLOAD</text>
<text x="650" y="770" text-anchor="middle" class="sub">Stateless  ·  No local storage  ·  Restartable  ·  Idempotent</text>

<!-- Callout -->
<rect x="60" y="794" width="1180" height="84" rx="8" class="box" stroke-dasharray="4 3"/>
<text x="650" y="816" text-anchor="middle" class="sub" font-weight="700">Why the secrets model is flipped between the two:</text>
<text x="650" y="832" text-anchor="middle" class="sub">the loader has its own hardened startup order (resolve identity → Postgres secret → Oracle secret → connectivity checks →</text>
<text x="650" y="846" text-anchor="middle" class="sub">migrations → table validation) that must run before any risky work. ECS-native secret injection would land raw credentials</text>
<text x="650" y="860" text-anchor="middle" class="sub">in the plain environment before that validation ever executes — exactly what the loader's design rejects. The API has no such</text>
<text x="650" y="872" text-anchor="middle" class="sub">ordering requirement, so it uses the simpler, standard ECS `secrets` block instead.</text>

<!-- Legend -->
<rect x="380" y="902" width="16" height="12" rx="3" class="boxAccent"/>
<text x="402" y="912" class="sub">holds Secrets Manager access (API path)</text>
<rect x="650" y="902" width="16" height="12" rx="3" class="boxAccent2"/>
<text x="672" y="912" class="sub">holds Secrets Manager access (loader path)</text>
<rect x="960" y="902" width="16" height="12" rx="3" class="boxNeutral"/>
<text x="982" y="912" class="sub">no Secrets Manager access</text>

<text x="650" y="940" text-anchor="middle" class="subtitle">terraform/modules/api_service (service) · terraform/modules/ecs (loader) — see INFRASTRUCTURE.md for the rest of the stack</text>
</svg>
