<svg viewBox="0 0 1300 740" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How ECS and Fargate are used in this project</title>
<desc>Two independent AWS Fargate workloads share the same account and VPC but are wired differently. The API runs as a long-running ECS service behind a load balancer, using ECS-native secret injection where the execution role fetches database credentials into the container's plain environment before the app starts. The ETL loader runs as a one-off task with no service, and deliberately does not use ECS-native secret injection: its execution role has no Secrets Manager access at all, and instead its task role fetches Postgres and Oracle secrets itself, inside the application, only after its own startup validation has run in the correct order.</desc>
<defs>
<style>
  svg { --bg:#ffffff; --panel:#f7f8fa; --border:#d7dce2; --borderStrong:#b7c0ca; --text:#1f2937; --textMut:#6b7280; --accent:#2563eb; --accentSoft:#e0e9fd; --accent2:#0f766e; --accent2Soft:#dcf3f0; --neutral:#9ca3af; --neutralSoft:#f1f2f4; }
  .title { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--text); font-size:19px; font-weight:700; }
  .subtitle { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:12px; }
  .colhead { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--text); font-size:13.5px; font-weight:700; }
  .label { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--text); font-size:12.5px; font-weight:600; }
  .sub { font-family:-apple-system,Helvetica,Arial,sans-serif; fill:var(--textMut); font-size:10px; }
  .box { fill:var(--panel); stroke:var(--borderStrong); stroke-width:1.3; }
  .boxAccent { fill:var(--accentSoft); stroke:var(--accent); stroke-width:1.4; }
  .boxAccent2 { fill:var(--accent2Soft); stroke:var(--accent2); stroke-width:1.4; }
  .boxNeutral { fill:var(--neutralSoft); stroke:var(--neutral); stroke-width:1.3; }
  .flow { stroke:var(--borderStrong); stroke-width:1.3; fill:none; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--borderStrong)"/></marker>
</defs>

<rect x="0" y="0" width="1300" height="740" fill="var(--bg)"/>
<text x="650" y="26" text-anchor="middle" class="title">How ECS / Fargate Is Used in This Project</text>
<text x="650" y="44" text-anchor="middle" class="subtitle">Two independent Fargate workloads, same account &amp; VPC, deliberately different secret-handling models</text>

<rect x="390" y="60" width="520" height="46" rx="8" class="boxNeutral"/>
<text x="650" y="79" text-anchor="middle" class="label">AWS Fargate</text>
<text x="650" y="93" text-anchor="middle" class="sub">serverless compute · no EC2 hosts to manage · every task gets its own ENI (awsvpc)</text>

<!-- Column headers -->
<text x="340" y="132" text-anchor="middle" class="colhead">API — long-running service</text>
<text x="960" y="132" text-anchor="middle" class="colhead">ETL LOADER — one-off task, no service</text>

<!-- Cluster -->
<rect x="60" y="142" width="560" height="42" rx="7" class="box"/>
<text x="340" y="167" text-anchor="middle" class="sub" font-weight="700">ECS cluster: research-archive-platform-{env}-api</text>
<rect x="680" y="142" width="560" height="42" rx="7" class="box"/>
<text x="960" y="167" text-anchor="middle" class="sub" font-weight="700">ECS cluster: research-archive-platform-{env}-etl</text>

<!-- Service / launch -->
<rect x="60" y="196" width="560" height="60" rx="8" class="boxAccent"/>
<text x="340" y="218" text-anchor="middle" class="label">aws_ecs_service</text>
<text x="340" y="233" text-anchor="middle" class="sub">desired_count tasks, FARGATE, platform LATEST</text>
<text x="340" y="246" text-anchor="middle" class="sub">keeps N running · replaces failed tasks automatically</text>

<rect x="680" y="196" width="560" height="60" rx="8" class="boxAccent2"/>
<text x="960" y="218" text-anchor="middle" class="label">No aws_ecs_service</text>
<text x="960" y="233" text-anchor="middle" class="sub">launched via run-task (run-award-attachment-loader.sh)</text>
<text x="960" y="246" text-anchor="middle" class="sub">runs once, does its work, exits — no ALB, no target group</text>

<!-- Task definition -->
<rect x="60" y="268" width="560" height="60" rx="8" class="box"/>
<text x="340" y="290" text-anchor="middle" class="label">Task definition: family "api"</text>
<text x="340" y="305" text-anchor="middle" class="sub">FARGATE · awsvpc · cpu 512 / mem 1024 · container "api" on containerPort</text>

<rect x="680" y="268" width="560" height="60" rx="8" class="box"/>
<text x="960" y="290" text-anchor="middle" class="label">Task definition: family "loader"</text>
<text x="960" y="305" text-anchor="middle" class="sub">FARGATE · awsvpc · cpu 512 / mem 1024 · container "loader"</text>

<!-- Roles -->
<rect x="60" y="342" width="265" height="84" rx="8" class="boxAccent"/>
<text x="192" y="364" text-anchor="middle" class="label">Execution role</text>
<text x="192" y="379" text-anchor="middle" class="sub">pull image · write logs +</text>
<text x="192" y="392" text-anchor="middle" class="sub">secretsmanager:GetSecretValue</text>
<text x="192" y="405" text-anchor="middle" class="sub">on the DB (+OpenAI) secret</text>
<text x="192" y="418" text-anchor="middle" class="sub">→ injects POSTGRES_*/etc as env vars</text>

<rect x="355" y="342" width="265" height="84" rx="8" class="boxNeutral"/>
<text x="487" y="364" text-anchor="middle" class="label">Task role</text>
<text x="487" y="379" text-anchor="middle" class="sub">no Secrets Manager access</text>
<text x="487" y="392" text-anchor="middle" class="sub">s3:ListBucket / GetObject</text>
<text x="487" y="405" text-anchor="middle" class="sub">on the documents bucket only</text>
<text x="487" y="418" text-anchor="middle" class="sub">(serves attachment downloads)</text>

<rect x="680" y="342" width="265" height="84" rx="8" class="boxNeutral"/>
<text x="812" y="364" text-anchor="middle" class="label">Execution role</text>
<text x="812" y="379" text-anchor="middle" class="sub">AmazonECSTaskExecutionRolePolicy</text>
<text x="812" y="392" text-anchor="middle" class="sub">only — pull image, write logs</text>
<text x="812" y="405" text-anchor="middle" class="sub">deliberately NO Secrets Manager</text>
<text x="812" y="418" text-anchor="middle" class="sub">access at all</text>

<rect x="975" y="342" width="265" height="84" rx="8" class="boxAccent2"/>
<text x="1107" y="364" text-anchor="middle" class="label">Task role</text>
<text x="1107" y="379" text-anchor="middle" class="sub">secretsmanager:GetSecretValue on</text>
<text x="1107" y="392" text-anchor="middle" class="sub">Postgres + Oracle secrets — the app</text>
<text x="1107" y="405" text-anchor="middle" class="sub">fetches these itself, at runtime,</text>
<text x="1107" y="418" text-anchor="middle" class="sub">after its own startup validation</text>

<!-- Network -->
<rect x="60" y="436" width="560" height="54" rx="8" class="box"/>
<text x="340" y="457" text-anchor="middle" class="sub" font-weight="700">Network: awsvpc · public or private subnets (assign_public_ip = !private)</text>
<text x="340" y="471" text-anchor="middle" class="sub">SG allows inbound only from the ALB's security group, on containerPort</text>

<rect x="680" y="436" width="560" height="54" rx="8" class="box"/>
<text x="960" y="457" text-anchor="middle" class="sub" font-weight="700">Network: awsvpc · private subnets only</text>
<text x="960" y="471" text-anchor="middle" class="sub">SG referenced directly in DB/Oracle security-group ingress rules</text>

<!-- Logs -->
<rect x="60" y="500" width="560" height="42" rx="7" class="box"/>
<text x="340" y="525" text-anchor="middle" class="sub">CloudWatch Logs: /ecs/{project}-{env}-api · stream prefix "api"</text>
<rect x="680" y="500" width="560" height="42" rx="7" class="box"/>
<text x="960" y="525" text-anchor="middle" class="sub">CloudWatch Logs: /ecs/{project}-{env}-loader · stream prefix "loader"</text>

<!-- connecting lines within columns -->
<path d="M340,184 L340,196" class="flow" marker-end="url(#arrow)"/>
<path d="M340,256 L340,268" class="flow" marker-end="url(#arrow)"/>
<path d="M340,328 L340,342" class="flow" marker-end="url(#arrow)"/>
<path d="M340,426 L340,436" class="flow" marker-end="url(#arrow)"/>
<path d="M340,490 L340,500" class="flow" marker-end="url(#arrow)"/>
<path d="M960,184 L960,196" class="flow" marker-end="url(#arrow)"/>
<path d="M960,256 L960,268" class="flow" marker-end="url(#arrow)"/>
<path d="M960,328 L960,342" class="flow" marker-end="url(#arrow)"/>
<path d="M960,426 L960,436" class="flow" marker-end="url(#arrow)"/>
<path d="M960,490 L960,500" class="flow" marker-end="url(#arrow)"/>

<!-- Callout -->
<rect x="60" y="560" width="1180" height="84" rx="8" class="box" stroke-dasharray="4 3"/>
<text x="650" y="582" text-anchor="middle" class="sub" font-weight="700">Why the secrets model is flipped between the two:</text>
<text x="650" y="598" text-anchor="middle" class="sub">the loader has its own hardened startup order (resolve identity → Postgres secret → Oracle secret → connectivity checks →</text>
<text x="650" y="612" text-anchor="middle" class="sub">migrations → table validation) that must run before any risky work. ECS-native secret injection would land raw credentials</text>
<text x="650" y="626" text-anchor="middle" class="sub">in the plain environment before that validation ever executes — exactly what the loader's design rejects. The API has no such</text>
<text x="650" y="638" text-anchor="middle" class="sub">ordering requirement, so it uses the simpler, standard ECS `secrets` block instead.</text>

<!-- Legend -->
<rect x="380" y="668" width="16" height="12" rx="3" class="boxAccent"/>
<text x="402" y="678" class="sub">holds Secrets Manager access (API path)</text>
<rect x="650" y="668" width="16" height="12" rx="3" class="boxAccent2"/>
<text x="672" y="678" class="sub">holds Secrets Manager access (loader path)</text>
<rect x="960" y="668" width="16" height="12" rx="3" class="boxNeutral"/>
<text x="982" y="678" class="sub">no Secrets Manager access</text>

<text x="650" y="712" text-anchor="middle" class="subtitle">terraform/modules/api_service (service) · terraform/modules/ecs (loader) — see INFRASTRUCTURE.md for the rest of the stack</text>
</svg>
